<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1c2436;
    --navy-light: #2c3650;
    --cream: #faf6ee;
    --card: #ffffff;
    --gold: #9c6b30;
    --gold-light: #d9a45c;
    --text: #201e1a;
    --text-light: #5c584f;
    --border: #e4dbc9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin:0; padding:0; background:var(--cream); color:var(--text);
    font-family:"Noto Sans TC", -apple-system, sans-serif;
    line-height:1.85; font-size:16px;
  }
  h1, h2, .serif { font-family:"Noto Serif TC", serif; }

  .header {
    background:var(--navy); color:#f3ede0; padding:18px 20px 18px;
    text-align:center;
  }
  .header .logo {
    max-width:100%; height:auto; margin-bottom:10px; border-radius:6px;
  }
  .header h1 {
    margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:.02em;
  }
  .header .datebar {
    font-size:13.5px; color:#f0d9b5; font-weight:600;
  }
  .header .vision {
    font-size:12.5px; color:#c9c4b0; margin-top:10px; line-height:1.6;
  }
  .header .vision b { color:#e8dcc4; }
  .header .rule {
    height:2px; margin-top:14px; border-radius:2px;
    background:linear-gradient(90deg, var(--gold-light) 0%, var(--gold) 45%, transparent 100%);
  }
  .header .updated {
    font-size:12px; color:#c7c3b3; margin-top:8px;
  }

  .quicknav {
    display:flex; gap:8px; overflow-x:auto; padding:12px 20px;
    background:var(--navy); position:sticky; top:0; z-index:10;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    border-bottom:2px solid var(--gold);
  }
  .quicknav::-webkit-scrollbar { display:none; }
  .quicknav a {
    flex-shrink:0; padding:7px 15px; border:1px solid var(--gold-light);
    border-radius:999px; font-size:13.5px; color:#fff2de; text-decoration:none;
    white-space:nowrap; font-weight:600; background:rgba(255,255,255,.05);
  }
  .quicknav a:active { background:var(--gold); color:#fff; border-color:var(--gold); }

  .container { max-width:640px; margin:0 auto; padding:18px 16px 60px; }

  .section {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:14px; overflow:hidden; scroll-margin-top:150px;
    box-shadow:0 1px 3px rgba(35,45,66,.05);
  }
  .section summary {
    padding:16px 18px; font-size:17.5px; font-weight:700; color:var(--navy);
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:9px;
  }
  .section summary::-webkit-details-marker { display:none; }
  .section summary .mark { color:var(--gold); font-size:15px; flex-shrink:0; }
  .section summary .arrow {
    margin-left:auto; font-size:12px; color:var(--text-light); transition:transform .25s;
  }
  .section[open] summary .arrow { transform:rotate(180deg); }
  .section .body {
    padding:0 18px 18px 43px; font-size:16px; color:var(--text);
    border-top:1px solid var(--border); padding-top:14px;
  }
  .section .body p { margin:10px 0; }
  .section .body ul { padding-left:20px; margin:10px 0; }
  .section .body li { margin:8px 0; }
  .section .body b { color:var(--navy); }
  .section .body a {
    color:var(--gold); font-weight:600; text-decoration:underline;
    text-decoration-color: var(--gold-light); text-underline-offset:2px;
  }

  /* 敬拜程序：點列引導線排版，接近原始PDF目錄式格式 */
  .order-group {
    font-family:"Noto Serif TC", serif; font-weight:700; color:var(--navy);
    font-size:15.5px; margin:16px 0 8px; letter-spacing:.03em;
  }
  .order-group:first-child { margin-top:0; }
  .order-row {
    display:flex; align-items:flex-end; gap:6px;
    font-size:15.5px; padding:5px 0; color:var(--text);
  }
  .order-row .label { white-space:nowrap; flex-shrink:0; }
  .order-row .dots {
    flex:1 1 auto; border-bottom:1.5px dotted #b3ab99;
    height:0; margin-bottom:4px; min-width:12px;
  }
  .order-row .name { white-space:nowrap; flex-shrink:0; color:var(--navy); font-weight:600; }

  /* 事奉輪值表 */
  .duty-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:4px -2px; }
  table.duty {
    width:100%; border-collapse:collapse; font-size:14.5px; min-width:380px;
  }
  table.duty th {
    background:var(--navy); color:#f3ede0; padding:9px 10px; text-align:left;
    font-weight:600; white-space:nowrap;
  }
  table.duty th:first-child { border-top-left-radius:8px; }
  table.duty th:last-child { border-top-right-radius:8px; }
  table.duty td {
    padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text);
  }
  table.duty td:first-child { font-weight:700; color:var(--navy); white-space:nowrap; }
  table.duty td.this-week { background:#fbf1de; font-weight:600; color:var(--navy); }
  table.duty tr:last-child td { border-bottom:none; }
  table.duty tr:nth-child(even) td:not(.this-week) { background:#faf8f3; }

  /* 通用表格樣式(聚會時間表/代禱事項/事工計畫/兒童主日等) */
  .duty-wrap table.plain {
    width:100%; border-collapse:collapse; font-size:14px; min-width:340px;
  }
  table.plain th {
    background:var(--navy); color:#f3ede0; padding:8px 9px; text-align:left; font-weight:600;
  }
  table.plain th:first-child { border-top-left-radius:8px; }
  table.plain th:last-child { border-top-right-radius:8px; }
  table.plain td {
    padding:8px 9px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:top;
  }
  table.plain tr:last-child td { border-bottom:none; }
  table.plain tr:nth-child(even) td { background:#faf8f3; }
  table.plain td:first-child { font-weight:600; color:var(--navy); white-space:nowrap; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
  .empty-state .icon { font-size:38px; margin-bottom:12px; }

  .refresh-btn {
    display:block; width:100%; padding:13px; margin-top:6px;
    background:var(--navy); color:#f3ede0; border:none; border-radius:10px;
    font-size:14.5px; text-align:center; cursor:pointer; font-weight:500;
  }

  #backToTop {
    position:fixed; bottom:22px; right:20px; width:48px; height:48px;
    background:var(--gold); color:#fff; border:none; border-radius:50%;
    font-size:20px; box-shadow:0 4px 14px rgba(35,45,66,.35);
    display:none; align-items:center; justify-content:center; cursor:pointer; z-index:20;
  }
  #backToTop.show { display:flex; }
</style>
</head>
<body>
  <div class="header">
    <img class="logo" id="churchLogo" src="assets/logo.png" alt="教會Logo" onerror="this.style.display='none'">
    <h1 id="churchName">週報</h1>
    <div class="datebar" id="dateBar"></div>
    <div class="vision" id="visionBar"></div>
    <div class="rule"></div>
    <div class="updated" id="updatedTime">載入中...</div>
  </div>
  <nav class="quicknav" id="quicknav"></nav>

  <div class="container" id="content">
    <div class="empty-state"><div class="icon">⏳</div><div>正在讀取最新週報...</div></div>
  </div>
  <div class="container" style="padding-top:0">
    <button class="refresh-btn" onclick="loadReport()">重新整理</button>
  </div>

  <button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script>
    const DATA_URL = 'https://raw.githubusercontent.com/WCEC-Media/weekly-bulletin/main/report.json';

    async function loadReport() {
      const contentEl = document.getElementById('content');
      const navEl = document.getElementById('quicknav');
      const updatedEl = document.getElementById('updatedTime');
      contentEl.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><div>正在讀取最新週報...</div></div>';
      navEl.innerHTML = '';

      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();

        document.getElementById('churchName').textContent = data.church_name || '週報';
        document.getElementById('dateBar').textContent = data.date_label || '';
        document.getElementById('visionBar').innerHTML =
          (data.vision ? `<b>教會異象</b>　${data.vision}` : '') +
          (data.theme ? `　｜　<b>年度主題</b>　${data.theme}` : '');
        updatedEl.textContent = '資料更新於 ' + (data.updatedAt || '未知時間');

        const sections = data.sections || [];
        if (!sections.length) throw new Error('no sections');

        navEl.innerHTML = sections.map((s, i) =>
          `<a href="#sec-${i}">${s.title}</a>`
        ).join('');

        contentEl.innerHTML = sections.map((s, i) => `
          <details class="section" id="sec-${i}" ${i < 2 ? 'open' : ''}>
            <summary><span class="mark">❖</span>${s.title}<span class="arrow">▾</span></summary>
            <div class="body">${s.html}</div>
          </details>
        `).join('');

      } catch (err) {
        contentEl.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>尚未有週報內容<br>排程任務執行後會自動顯示在這裡</div></div>';
        updatedEl.textContent = '尚無資料';
      }
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('backToTop');
      if (window.scrollY > window.innerHeight * 0.6) btn.classList.add('show');
      else btn.classList.remove('show');
    });

    document.addEventListener('click', (e) => {
      const a = e.target.closest('.quicknav a');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      const el = document.getElementById(id);
      if (el && !el.open) el.open = true;
    });

    loadReport();
  </script>
</body>
</html>
